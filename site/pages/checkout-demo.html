<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vida Ativa - Pagamento (demonstração)</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/aluno.css">
    <link rel="stylesheet" href="../assets/css/pagamento.css">
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>
</head>
<body class="pagina-aluno pagina-pagamento">
    <header class="topo-aluno">
        <div class="marca-aluno">
            <img src="../assets/img/logo.jpeg" alt="Vida Ativa">
            <span>Pagamento seguro</span>
        </div>
    </header>

    <main class="conteudo-aluno demo-conteudo">
        <section class="painel demo-painel">
            <p class="aviso-demo">PÁGINA DE DEMONSTRAÇÃO. Esta página imita o pagamento com cartão. Nenhum dado de cartão é pedido e nenhum valor é cobrado.</p>
            <div class="aviso-erro" id="avisoErro" role="alert" hidden></div>
            <div class="painel-header"><div><h2>Pagamento com cartão</h2><p id="demoMes">—</p></div></div>
            <div class="valor-fatura"><span>Valor</span><strong id="demoValor">—</strong></div>
            <button type="button" class="btn-principal-aluno" id="btnAprovar">Aprovar pagamento</button>
            <button type="button" class="btn-secundario-aluno" id="btnRecusar">Recusar pagamento</button>
            <button type="button" class="btn-secundario-aluno" id="btnVoltar">Voltar sem pagar</button>
        </section>
    </main>
    <script src="../assets/js/checkout-demo.js"></script>
</body>
</html>
